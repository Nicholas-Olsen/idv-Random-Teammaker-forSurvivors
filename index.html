<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맵 & 생존자 밴픽 조합 생성기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- [1단계] 맵 선택 화면 -->
    <div id="mapScreen" class="screen">
        <h1>1단계: 전장(맵) 선택</h1>
        <p>9개 맵 중 하나가 선택됩니다.</p>
        <button class="btn-primary" onclick="selectMap()">맵 랜덤</button>

        <hr style="margin: 30px 0; border: 0; border-top: 1px dashed #ccc;">
        <p style="color: #666;">또는</p>
        <button class="btn-fourth" onclick="toggleManualMapSelect()">직접 고르기</button>

        <div id="manualMapSelectArea" class="hidden" style="margin-top: 20px;">
            <select id="mapDropdown" onchange="onMapDropdownChange()"
                style="padding: 10px; font-size: 1.1em; border-radius: 5px; border: 1px solid #ccc; width: 70%; max-width: 300px; cursor: pointer; color: gray;">
                <option value="" style="color: gray;">-- 맵을 선택하세요 --</option>
            </select>
            <button class="btn-success" onclick="confirmManualMap()">선택 완료</button>
        </div>
    </div>

    <!-- [2단계] 조합 & 밴픽 화면 -->
    <div id="comboScreen" class="screen hidden">
        <h1>2단계: 팀 조합 생성</h1>
        <div id="currentMapDisplay" class="map-display"></div>

        <!-- 컨트롤 버튼 영역 -->
        <div id="controlsArea">
            <!-- 기본 모드 버튼 -->
            <div id="normalButtons">
                <button class="btn-success" onclick="generateCombination()">조합 생성</button>
                <button class="btn-warning" onclick="enterBanMode()">밴 선택 (최대 10개)</button>
                <button class="btn-secondary" onclick="resetToMapSelection()">처음으로</button>
            </div>
            <!-- 밴 편집 모드 버튼 -->
            <div id="banButtons" class="hidden">
                <p class="info-text" style="color:rgb(255, 79, 79); font-weight:bold; font-size: 1.1em;">캐릭터를 클릭해 금지하세요.
                </p>
                <button class="btn-danger" onclick="applyBans()">밴 지정 완료</button>
                <button class="btn-secondary" onclick="cancelBanMode()">취소</button>
            </div>
        </div>
        <!-- 최종 조합 결과 출력 영역 -->
        <div class="result-container" id="resultArea"></div>

        <!-- 캐릭터 전체 목록 (로스터) -->
        <div class="roster-container" id="rosterArea">
        </div>

    </div>
    <!-- 💡 화면 우측 하단 BGM 플레이어 (플리 포함) -->
    <div id="bgm-container">
        <!-- 위로 열리는 곡 목록 (기본은 숨김) -->
        <div id="playlist-menu" class="hidden">
            <ul id="playlist-ul">
            </ul>
        </div>

        <!-- 아이콘과 BGM 제목이 있는 상단바 -->
        <div class="bgm-header">
            <div class="bgm-title"><span class="icon">🎵</span> BGM Player</div>
            <button id="playlist-btn" onclick="togglePlaylist()">☰</button>
        </div>

        <!-- 오디오 재생바 -->
        <audio id="bgm-audio" controls loop>
            <source id="bgm-source" src="" type="audio/mpeg">
        </audio>
    </div>

</body>

</html>
